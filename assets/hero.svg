<svg width="900" height="330" viewBox="0 0 900 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sajjad Dehghan — Product, AI and execution</title>
  <desc id="desc">Animated personal brand banner showing a product development orbit from discovery to measurable delivery.</desc>

  <defs>
    <linearGradient id="bg" x1="30" y1="10" x2="870" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E1BE7E"/>
      <stop offset="0.52" stop-color="#F2DDAE"/>
      <stop offset="1" stop-color="#D8B46F"/>
    </linearGradient>
    <linearGradient id="line" x1="85" y1="70" x2="800" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3D7C73"/>
      <stop offset="0.5" stop-color="#B98735"/>
      <stop offset="1" stop-color="#6C8B78"/>
    </linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientTransform="translate(708 166) rotate(90) scale(59)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C89A4A"/>
      <stop offset="0.68" stop-color="#9B6A2F"/>
      <stop offset="1" stop-color="#5A3E25"/>
    </radialGradient>
    <filter id="blur24" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#0D2B45" stroke-opacity="0.07"/>
    </pattern>
    <clipPath id="round"><rect width="900" height="330" rx="22"/></clipPath>
  </defs>

  <style>
    .eyebrow { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 3px; }
    .name { font: 750 44px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -1.2px; }
    .role { font: 550 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .small { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.2px; }
    .micro { font: 650 9px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1px; }
    .intro { animation: reveal 1.2s cubic-bezier(.2,.8,.2,1) both; transform-origin: 90px 110px; }
    .rule { stroke-dasharray: 300; stroke-dashoffset: 300; animation: draw 1.5s .45s ease-out forwards; }
    .orbit { transform-origin: 708px 166px; animation: rotate 24s linear infinite; }
    .counter { transform-origin: center; animation: rotateBack 24s linear infinite; }
    .pulse { transform-origin: 708px 166px; animation: pulse 3.2s ease-in-out infinite; }
    .scan { animation: scan 4.8s ease-in-out infinite; }
    .spark { animation: blink 2.6s ease-in-out infinite; }
    .spark.two { animation-delay: -1.1s; }
    .spark.three { animation-delay: -2s; }
    @keyframes reveal { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes rotate { to { transform: rotate(360deg); } }
    @keyframes rotateBack { to { transform: rotate(-360deg); } }
    @keyframes pulse { 0%,100% { transform: scale(.94); opacity: .65; } 50% { transform: scale(1.08); opacity: 1; } }
    @keyframes scan { 0%,100% { transform: translateX(-10px); opacity: .2; } 50% { transform: translateX(160px); opacity: .8; } }
    @keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#round)">
    <rect width="900" height="330" fill="url(#bg)"/>
    <rect width="900" height="330" fill="url(#grid)"/>
    <circle cx="127" cy="60" r="100" fill="#3D7C73" fill-opacity=".11" filter="url(#blur24)"/>
    <circle cx="746" cy="218" r="140" fill="#B98735" fill-opacity=".15" filter="url(#blur24)"/>
    <path d="M-40 286C170 225 322 362 534 276C689 213 780 226 950 120" stroke="url(#line)" stroke-opacity=".12" stroke-width="38" filter="url(#blur24)"/>

    <g class="intro">
      <text x="84" y="82" class="eyebrow" fill="#3D7C73">PRODUCT × AI × EXECUTION</text>
      <text x="82" y="137" class="name" fill="#0D2B45">SAJJAD DEHGHAN</text>
      <text x="84" y="174" class="role" fill="#173F5F">Product Specialist · AI-assisted Product Builder</text>
      <text x="84" y="202" class="role" fill="#4C6B74">Turning ambiguity into measurable product momentum.</text>
      <path class="rule" d="M84 229H430" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>
      <g transform="translate(84 251)">
        <rect width="94" height="26" rx="13" fill="#3D7C73" fill-opacity=".14" stroke="#3D7C73" stroke-opacity=".55"/>
        <circle cx="15" cy="13" r="3" fill="#3D7C73" class="spark"/>
        <text x="26" y="17" class="small" fill="#174C49">DISCOVER</text>
      </g>
      <g transform="translate(188 251)">
        <rect width="70" height="26" rx="13" fill="#B98735" fill-opacity=".14" stroke="#9B6A2F" stroke-opacity=".5"/>
        <text x="14" y="17" class="small" fill="#704716">DESIGN</text>
      </g>
      <g transform="translate(268 251)">
        <rect width="62" height="26" rx="13" fill="#6C8B78" fill-opacity=".15" stroke="#567562" stroke-opacity=".5"/>
        <text x="15" y="17" class="small" fill="#355A49">SHIP</text>
      </g>
      <g transform="translate(340 251)">
        <rect width="90" height="26" rx="13" fill="#C89A4A" fill-opacity=".15" stroke="#9B6A2F" stroke-opacity=".5"/>
        <text x="14" y="17" class="small" fill="#704716">MEASURE</text>
      </g>
    </g>

    <g>
      <circle cx="708" cy="166" r="116" stroke="#0D2B45" stroke-opacity=".18" stroke-dasharray="4 8"/>
      <circle cx="708" cy="166" r="87" stroke="url(#line)" stroke-opacity=".36"/>
      <circle class="pulse" cx="708" cy="166" r="62" fill="#B98735" fill-opacity=".2" filter="url(#blur24)"/>
      <circle cx="708" cy="166" r="48" fill="url(#core)" stroke="#E6C77F" stroke-opacity=".7"/>
      <circle cx="708" cy="166" r="36" stroke="#FFF0C7" stroke-opacity=".26" stroke-dasharray="2 5"/>
      <text x="708" y="162" text-anchor="middle" class="micro" fill="#FFF0C7">MAKE IT</text>
      <text x="708" y="179" text-anchor="middle" class="small" fill="#FFF7E1">REAL</text>

      <g class="orbit">
        <g transform="translate(708 50)"><g class="counter">
          <circle r="12" fill="#0D2B45" stroke="#6C8B78"/><circle r="3" fill="#7FA08A" filter="url(#glow)"/>
        </g></g>
        <g transform="translate(824 166)"><g class="counter">
          <circle r="12" fill="#0D2B45" stroke="#E6C77F"/><path d="M-4 0h8M0-4v8" stroke="#E6C77F" stroke-linecap="round"/>
        </g></g>
        <g transform="translate(708 282)"><g class="counter">
          <circle r="12" fill="#0D2B45" stroke="#C89A4A"/><path d="M-4 2l3-3 3 2 4-5" stroke="#E6C77F" stroke-linecap="round" stroke-linejoin="round"/>
        </g></g>
        <g transform="translate(592 166)"><g class="counter">
          <circle r="12" fill="#0D2B45" stroke="#3D7C73"/><path d="M-4-3h8v6h-8z" stroke="#7FA08A"/>
        </g></g>
      </g>

      <path class="scan" d="M615 111V221" stroke="#3D7C73" stroke-opacity=".5"/>
      <circle cx="836" cy="80" r="2" fill="#3D7C73" class="spark"/>
      <circle cx="574" cy="90" r="2.5" fill="#B98735" class="spark two"/>
      <circle cx="854" cy="258" r="2" fill="#6C8B78" class="spark three"/>
    </g>

    <text x="868" y="306" text-anchor="end" class="micro" fill="#4C6B74">TEHRAN · BUILDING FOR THE WORLD</text>
  </g>
  <rect x=".5" y=".5" width="899" height="329" rx="21.5" stroke="url(#line)" stroke-opacity=".22"/>
</svg>
