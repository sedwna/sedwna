name: Generate contribution animation

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the profile source
        uses: actions/checkout@v5

      - name: Generate real monthly activity animation
        run: node scripts/generate-monthly-snake.mjs
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}

      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v5
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
