name: Generate contribution animation

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the profile source
        uses: actions/checkout@v5

      - name: Generate the real contribution snake game
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-activity-snake.svg?color_snake=#9B6A2F&color_dots=#EAD7AE,#D5C18F,#6C8B78,#4F8C77,#315F5B
            dist/github-activity-snake-dark.svg?palette=github-dark&color_snake=#D7AD61&color_dots=#14354D,#315F5B,#3D756B,#4F8C77,#7AA27E

      - name: Add calendar labels and weighted progress
        run: node scripts/enhance-snake.mjs
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}

      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v5
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
